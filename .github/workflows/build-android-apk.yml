name: Build Android APK

# Builds the release APK(s) and uploads them as a downloadable artifact.
# Run it from the Actions tab (Run workflow) or by pushing to main.
# Release builds are signed with the project's development (debug) key,
# exactly as android/app/build.gradle.kts is configured today.
on:
  workflow_dispatch:
    inputs:
      target_platform:
        description: "ABI(s) to build"
        type: choice
        default: android-arm64
        options:
          - android-arm64
          - android-arm,android-arm64,android-x64
      run_checks:
        description: "Run flutter analyze and flutter test before building"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the verified Flutter SDK revision (3.44.4)
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/bdk-flutter-sdk"
          git init "$sdk"
          git -C "$sdk" remote add origin https://github.com/flutter/flutter.git
          git -C "$sdk" fetch --depth=1 origin ad70ec4617166f1c38e5d2bfd388af71fda14f06
          git -C "$sdk" checkout --detach FETCH_HEAD
          echo "$sdk/bin" >> "$GITHUB_PATH"

      - name: Install Android NDK and CMake
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle and pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: android-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.kts', 'android/**/*.gradle') }}
          restore-keys: |
            android-${{ runner.os }}-

      - name: Flutter version
        run: flutter --version

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        if: github.event_name == 'workflow_dispatch' && inputs.run_checks
        run: flutter analyze --no-pub

      - name: Flutter tests
        if: github.event_name == 'workflow_dispatch' && inputs.run_checks
        run: flutter test --no-pub

      - name: Build release APK
        run: |
          flutter build apk --release --no-pub --split-per-abi \
            --target-platform "${{ inputs.target_platform || 'android-arm64' }}" \
            -t lib/main.dart

      - name: List built APKs
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bdk-audio-apk
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 30
