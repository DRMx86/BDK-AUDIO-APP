name: Native preview checks

# Prepared locally. This workflow never publishes a release or uses hardware.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the verified Flutter SDK revision
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bdkSdk = Join-Path $env:RUNNER_TEMP 'bdk-flutter-sdk'
          git init $bdkSdk
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C $bdkSdk remote add origin https://github.com/flutter/flutter.git
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C $bdkSdk fetch --depth=1 origin ad70ec4617166f1c38e5d2bfd388af71fda14f06
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C $bdkSdk checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          (Join-Path $bdkSdk 'bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Project-local Windows plugin links
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/sync_windows_plugin_junctions.ps1
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Diagnostic build identity policy
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/identity-policy-tests | Out-Null
          javac -d build/identity-policy-tests android/buildSrc/src/main/java/BdkBuildIdentity.java android/buildSrc/src/test/java/BdkBuildIdentityTest.java
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          java -cp build/identity-policy-tests BdkBuildIdentityTest
          exit $LASTEXITCODE
      - name: Flutter tests
        run: flutter test --no-pub
      - name: Build Windows preview bundle
        if: runner.os == 'Windows'
        run: flutter build windows --debug --no-pub --dart-define=BDK_PREVIEW_ONLY=true
      - name: Windows native audio identity checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S windows/runner/audio_connection_tests -B build/audio_connection_tests -G 'Visual Studio 17 2022' -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/audio_connection_tests --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & build/audio_connection_tests/Release/bdk_audio_connection_tests.exe
          exit $LASTEXITCODE
      - name: Build Linux preview bundle
        if: runner.os == 'Linux'
        run: flutter build linux --debug --no-pub --dart-define=BDK_PREVIEW_ONLY=true
      - name: Build Apple previews without release signing
        if: runner.os == 'macOS'
        run: |
          flutter build macos --debug --no-pub --dart-define=BDK_PREVIEW_ONLY=true
          flutter build ios --simulator --debug --no-codesign --no-pub --dart-define=BDK_PREVIEW_ONLY=true
      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Debug/* -DestinationPath bdk-windows-preview.zip
      - name: Archive Linux bundle
        if: runner.os == 'Linux'
        run: tar -czf bdk-linux-preview.tar.gz -C build/linux/x64/debug/bundle .
      - name: Archive Apple bundles preserving symlinks
        if: runner.os == 'macOS'
        run: |
          tar -czf bdk-macos-preview.tar.gz -C build/macos/Build/Products/Debug 'BDK Audio.app'
          tar -czf bdk-ios-simulator-preview.tar.gz -C build/ios/iphonesimulator Runner.app
      - name: Retain development bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bdk-native-preview-${{ runner.os }}
          path: |
            bdk-*-preview.zip
            bdk-*-preview.tar.gz
          if-no-files-found: error
          retention-days: 7
