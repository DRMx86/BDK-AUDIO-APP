name: bdk_audio_decoder
description: Portable and platform-native offline decoding for bounded BDK sound imports.
version: 0.0.1
publish_to: none
environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'
dependencies:
  ffi: ^2.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
